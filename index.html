<!DOCTYPE html>
<html>
<head>
	<title>exercise</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body> 
	<div class="container">
		
		<details ontoggle="message()">
		<summary> Instructions </summary>
		<i> Enter 2 numbers, find its sum</i>	
		</details> 

		<form> 

			<label> enter 1st number: </label>
			<input type="number" id="num1" placeholder="type here....">

<br> 

<label> enter 2nd number</label>
			<input type="number" id="num2" placeholder="type here....">


			<br>

			<button type="button" onclick = "minus()"> CALCULATE</button>
			<h1 id="Result">RESULT</h1>


			<label> enter 3rd number: </label>
			<input type="number" id="num3" placeholder="type here....">

<br> 

<label> enter 4th number</label>
			<input type="number" id="num4" placeholder="type here....">

			<button type="button" onclick = "add()"> CALCULATE</button>
			<h1 id="result">RESULT</h1>
		</form>



</div>

<script> 
	function message(){
	alert("Try it");	
	}

	function minus(){
	 var minus1 = document.getElementById ("num1").value
	 var minus2 = document.getElementById ("num2").value;
      var ans = Number(minus1)- Number(minus2);

        document.getElementById('Result').innerHTML = 'Answer is' + '' + ans; 

	}

	function add(){
	 var add1 = document.getElementById ("num3").value
	 var add2 = document.getElementById ("num4").value;
      var sum = Number(add1)+ Number(add2);

        document.getElementById('result').innerHTML = 'Answer is' + '' + sum; 

	}


</script>

</html>
